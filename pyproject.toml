[project]
name = "luatvn-ai"
version = "0.1.0"
description = "Chatbot pháp luật Việt Nam chạy hoàn toàn local (RAG trên corpus thuvienphapluat.vn)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.35",
    "polars>=1.20",
    "pyarrow>=18",
    "numpy>=2.1",
    "sentence-transformers>=3.4",
    "torch>=2.6",
    "lancedb>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "regex>=2024.11",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.1",
]

[tool.uv]
package = false
